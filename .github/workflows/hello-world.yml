name: Run Sync

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    env:
      AIRTABLE_API_ACCESS_TOKEN: ${{ secrets.AIRTABLE_API_ACCESS_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
      AIRTABLE_API_URL: ${{ secrets.AIRTABLE_API_URL }}
      AIRTABLE_VIEW_ID: ${{ secrets.AIRTABLE_VIEW_ID }}
      CURATED_API_TOKEN: ${{ secrets.CURATED_API_TOKEN }}
      CURATED_API_URL: ${{ secrets.CURATED_API_URL }}
      CURATED_PUBLICATION_ID: ${{ secrets.CURATED_PUBLICATION_ID }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Restore dependencies
      run: |
        dotnet nuget locals all --clear
        dotnet restore
      working-directory: ./NewIssuePreparator
      
    - name: Build
      run: dotnet build --configuration Release
      working-directory: ./NewIssuePreparator
      
    - name: Run
      run: dotnet run --configuration Release
      working-directory: ./NewIssuePreparator
